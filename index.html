<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Roope Mäkiranta's CV as a scroll-driven 3D journey: from shelves and pallets to Azure pipelines." />
    <title>Roope Mäkiranta | CV Timeline</title>
    <meta name="theme-color" content="#0e1117" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Roope Mäkiranta | Senior Software Developer" />
    <meta property="og:description" content="From angle grinders and pallets to Azure pipelines: a CV you walk through by scrolling." />
    <meta property="og:url" content="https://roobm.github.io/AnimatedHistory/" />
    <link rel="canonical" href="https://roobm.github.io/AnimatedHistory/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1117'/%3E%3Crect x='6' y='9' width='20' height='16' fill='%23b07a4a'/%3E%3Crect x='6' y='9' width='20' height='4' fill='%23ffc857'/%3E%3Crect x='11' y='16' width='3' height='3' fill='%230e1117'/%3E%3Crect x='18' y='16' width='3' height='3' fill='%230e1117'/%3E%3C/svg%3E" />

  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="progress" aria-hidden="true"></div>

    <header class="hero">
      <h1 id="name"></h1>
      <p id="title"></p>
      <p id="tagline"></p>
      <p id="hint" aria-hidden="true">Scroll to walk ↓</p>
      <p id="keys" aria-hidden="true">← → walk (Shift runs), ↑ jump, ↑↑ flip</p>
    </header>

    <button id="hunt" type="button" hidden></button>
    <nav id="nav" aria-label="Chapters"></nav>
    <main id="chapters"></main>
    <p id="bubble" role="status" aria-live="polite"></p>
    <noscript><p class="noscript">This CV is an animated timeline and needs JavaScript to show its chapters.</p></noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

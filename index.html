<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Roope Mäkiranta's CV as a scroll-driven 3D journey: from shelves and pallets to Azure pipelines." />
    <title>Roope Mäkiranta | CV Timeline</title>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="progress" aria-hidden="true"></div>

    <header class="hero">
      <h1 id="name"></h1>
      <p id="title"></p>
      <p id="tagline"></p>
      <p id="hint" aria-hidden="true">Scroll to walk ↓</p>
    </header>

    <button id="hunt" type="button" hidden></button>
    <nav id="nav" aria-label="Chapters"></nav>
    <main id="chapters"></main>
    <p id="bubble" role="status" aria-live="polite"></p>
    <noscript><p class="noscript">This CV is an animated timeline and needs JavaScript to show its chapters.</p></noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
